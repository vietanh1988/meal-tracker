# Kiểm tra tự động trước khi lên prod.
# Đẩy code lên nhánh ci/** (hoặc feat/**, fix/**) → dựng Supabase LOCAL (dữ liệu giả) → build app
# → unit test + E2E Playwright → ĐẠT thì tự gộp (fast-forward) vào main → Vercel deploy prod.
# Không đụng database thật, không gọi AI thật.
name: E2E

on:
  push:
    branches: ["ci/**", "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dựng Supabase local (schema prod + dữ liệu giả)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Biến môi trường trỏ Supabase local
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SERVICE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Unit test
        run: |
          node --test tests/*.test.mjs
          node tests/check-logic.mjs
          bun test tests/integration

      - name: Build (trỏ Supabase local)
        run: npx vite build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test

      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  promote:
    needs: e2e
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gộp vào main (chỉ fast-forward)
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Nhánh chưa dựa trên main mới nhất — rebase lại rồi đẩy lại"; exit 1
          fi
          git push origin HEAD:main
