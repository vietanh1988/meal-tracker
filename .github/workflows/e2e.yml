# Kiểm tra tự động trước khi lên prod.
# Đẩy code lên nhánh ci/** (hoặc feat/**, fix/**) → dựng Supabase LOCAL (dữ liệu giả) → build app
# → unit test + E2E Playwright → ĐẠT thì tự gộp (fast-forward) vào main → Vercel deploy prod.
# Không đụng database thật, không gọi AI thật.
name: E2E

on:
  push:
    branches: ["ci/**", "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - name: Cài Supabase CLI
        id: sbcli
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Cài Supabase CLI (thử lại khi lỗi mạng)
        if: steps.sbcli.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dựng Supabase local (schema prod + dữ liệu giả)
        run: |
          # thỉnh thoảng tải image Docker lỗi mạng → thử lại tối đa 3 lần
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,edge-runtime,logflare,vector && exit 0
            echo "supabase start lỗi lần $i, thử lại"; supabase stop --no-backup || true; sleep 15
          done
          exit 1

      - name: Biến môi trường trỏ Supabase local
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SERVICE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "E2E_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Unit test
        run: |
          node --test tests/*.test.mjs
          node tests/check-logic.mjs
          # mỗi file 1 tiến trình riêng: mock.module của bun dùng chung trong 1 tiến trình
          for f in tests/integration/*.bun.test.js; do bun test "./$f" || exit 1; done

      - name: Build (trỏ Supabase local)
        run: npx vite build

      - name: Web fipilotai.com (Next.js trong web/) — test + build
        working-directory: web
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund && npm test && NEXT_PUBLIC_SUPABASE_URL="$VITE_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" npm run build; } 2>&1 | tee /tmp/web-build.txt

      - name: Đưa lỗi build web lên annotation
        if: failure()
        run: |
          [ -f /tmp/web-build.txt ] || exit 0
          body=$(tail -n 80 /tmp/web-build.txt | sed 's/\x1b\[[0-9;]*m//g' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Web build log::$body"

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee /tmp/e2e.txt

      - name: Lưu ảnh chụp màn hình lên nhánh shots/<nhánh> (để so với bản vẽ)
        if: always()
        run: |
          [ -d shots ] || exit 0
          B="shots/${GITHUB_REF_NAME//\//-}"
          mkdir -p /tmp/sh && cp -r shots /tmp/sh/
          # Nhánh ảnh không có vercel.json của app → Vercel vẫn build xem thử, tốn lượt deploy. Tắt hẳn cho nhánh này.
          echo '{"git":{"deploymentEnabled":false}}' > /tmp/sh/vercel.json
          cd /tmp/sh && git init -q && git checkout -q -b tmp && git add shots vercel.json
          git -c user.name=ci -c user.email=ci@local commit -q -m "ảnh chụp E2E $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$B"

      - name: Đưa lỗi lên annotation (đọc được qua API)
        if: failure()
        run: |
          for f in /tmp/e2e.txt; do
            [ -f "$f" ] || continue
            body=$(grep -v "retrying click action\|waiting 500ms\|waiting for element\|element is not" "$f" | tail -n 200 | sed 's/\x1b\[[0-9;]*m//g' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=E2E log tail::$body"
          done

      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  promote:
    needs: e2e
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gộp vào main (chỉ fast-forward)
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Nhánh chưa dựa trên main mới nhất — rebase lại rồi đẩy lại"; exit 1
          fi
          git push origin HEAD:main
